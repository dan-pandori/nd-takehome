# GitHub Actions workflow (run repo-hygiene). Lives in .github/workflows/ci.yml; see ci/install_workflow.sh.
name: ci
on:
  push:
    branches: [dan, 'ci-*']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/requirements-ci.txt
      - name: Cache Lean (elan)
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-lean4-v4.34.1
      - name: Install Lean 4 v4.34.1
        run: |
          if [ ! -x ~/.elan/bin/lean ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --no-modify-path --default-toolchain leanprover/lean4:v4.34.1
          fi
          ~/.elan/bin/lean --version
      - name: Install Python dependencies (CPU torch)
        run: pip install -r ci/requirements-ci.txt
      - name: Tests
        run: sh ci/run_ci.sh
